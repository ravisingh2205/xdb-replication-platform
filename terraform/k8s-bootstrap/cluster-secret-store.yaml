# Apply once after `terraform apply` (External Secrets CRDs must exist first):
#   kubectl apply -f terraform/k8s-bootstrap/cluster-secret-store.yaml
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1   # match var.region
