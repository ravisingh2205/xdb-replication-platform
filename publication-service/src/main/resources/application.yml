server:
  port: 8081

spring:
  application:
    name: publication-service
  datasource:
    url: ${METADATA_DB_URL:jdbc:postgresql://localhost:5432/xdb_metadata}
    username: ${METADATA_DB_USER:xdb}
    password: ${METADATA_DB_PASSWORD:xdb}
    hikari:
      # Every connection works inside this service's own schema (outbox and secret SQL included).
      schema: publication
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: publication
  flyway:
    schemas: publication
    default-schema: publication
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    # MSK IAM auth on AWS is enabled through the "aws" profile below.

xdb:
  outbox:
    enabled: true
    poll-interval-ms: 500
  secrets:
    provider: ${XDB_SECRETS_PROVIDER:local}
    local-key: ${XDB_SECRETS_LOCAL_KEY:change-me-local-dev-key-32chars!!}
    aws-prefix: ${XDB_SECRETS_AWS_PREFIX:xdb/}
  connect:
    url: ${KAFKA_CONNECT_URL:http://localhost:8083}
    kafka-bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    default-partitions: ${XDB_CDC_PARTITIONS:3}
    replication-factor: ${XDB_CDC_REPLICATION_FACTOR:1}
    secret-mode: ${XDB_CONNECT_SECRET_MODE:inline}
    config-provider-alias: aws
    snapshot-threads: ${XDB_SNAPSHOT_THREADS:4}
    reconcile-interval-ms: 30000

resilience4j:
  retry:
    instances:
      kafkaConnect:
        max-attempts: 4
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.xdb.replication.common.web.ApiExceptions$UpstreamException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
  circuitbreaker:
    instances:
      kafkaConnect:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - java.lang.IllegalArgumentException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: aws
  kafka:
    security:
      protocol: SASL_SSL
    properties:
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
xdb:
  secrets:
    provider: aws
  connect:
    secret-mode: config-provider
    replication-factor: 3
