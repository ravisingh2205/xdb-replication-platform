# Synced from AWS Secrets Manager by the External Secrets Operator (installed by Terraform).
# Locally you can replace this with a plain Secret of the same name.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: xdb-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: xdb-secrets
  data:
    - secretKey: METADATA_DB_USER
      remoteRef: { key: xdb/platform/metadata-db, property: username }
    - secretKey: METADATA_DB_PASSWORD
      remoteRef: { key: xdb/platform/metadata-db, property: password }
    - secretKey: XDB_INTERNAL_TOKEN
      remoteRef: { key: xdb/platform/internal-token }
    - secretKey: XDB_SECRETS_LOCAL_KEY
      remoteRef: { key: xdb/platform/local-key }
