apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscription-service
  labels: { app: subscription-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: subscription-service }
  template:
    metadata:
      labels: { app: subscription-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8082"
    spec:
      serviceAccountName: subscription-service
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: subscription-service }
      containers:
        - name: subscription-service
          image: xdb/subscription-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef: { name: xdb-config }
            - secretRef: { name: xdb-secrets }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 60
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: subscription-service
spec:
  selector: { app: subscription-service }
  ports:
    - port: 8082
      targetPort: 8082
