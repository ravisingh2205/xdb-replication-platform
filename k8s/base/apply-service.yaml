apiVersion: apps/v1
kind: Deployment
metadata:
  name: apply-service
  labels: { app: apply-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: apply-service }
  template:
    metadata:
      labels: { app: apply-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8084"
    spec:
      serviceAccountName: apply-service
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: apply-service }
      containers:
        - name: apply-service
          image: xdb/apply-service:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef: { name: xdb-config }
            - secretRef: { name: xdb-secrets }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            initialDelaySeconds: 60
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: apply-service
spec:
  selector: { app: apply-service }
  ports:
    - port: 8084
      targetPort: 8084
---
# Keep at least one apply pod during node drains/upgrades so replication never fully stops.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apply-service
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: apply-service }
---
# KEDA scales apply pods on Kafka consumer lag. Each subscription is its own consumer group;
# list the busiest ones here (or generate one ScaledObject per subscription from CI).
# Upper bound is effectively the partition count: extra consumers in a group sit idle.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: apply-service
spec:
  scaleTargetRef:
    name: apply-service
  minReplicaCount: 2
  maxReplicaCount: 12
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: xdb-apply-orders_sub
        topic: ""                # empty = all topics the group consumes
        lagThreshold: "5000"     # target lag per pod
        allowIdleConsumers: "false"
