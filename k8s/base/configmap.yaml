apiVersion: v1
kind: ConfigMap
metadata:
  name: xdb-config
data:
  # Overridden per environment by the overlay (MSK bootstrap brokers, RDS endpoint).
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  METADATA_DB_URL: "jdbc:postgresql://metadata-db:5432/xdb_metadata"
  KAFKA_CONNECT_URL: "http://kafka-connect:8083"
  PUBLICATION_SERVICE_URL: "http://publication-service:8081"
  SUBSCRIPTION_SERVICE_URL: "http://subscription-service:8082"
  APPLY_SERVICE_URL: "http://apply-service:8084"
  SPRING_PROFILES_ACTIVE: "default"
  XDB_CDC_PARTITIONS: "3"
  XDB_CDC_REPLICATION_FACTOR: "1"
  XDB_APPLY_CONCURRENCY: "3"
